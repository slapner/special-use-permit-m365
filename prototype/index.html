<script>
(function(){
"use strict";
/* ================= constants from spec/data-model.md ================= */
const STATUSES=["Received","Under Review","Draft Permit","Out for Permittee Signature","Out for Superintendent Signature","Executed","Active","Closed"];
const OFFRAMPS=["Withdrawn","Denied"];
const CLOSED_SET=new Set(["Closed","Withdrawn","Denied"]);
const IMPACTS=[
 ["Ground disturbance","Digging, trenching, grading, staking, post holes, or vehicle ruts."],
 ["Near stream, river or wetland","Any activity within about 100 ft of a stream, river, pond, or wetland."],
 ["Tree clearing","Cutting, trimming, or removing trees or large limbs."],
 ["Structures or temporary facilities","Tents, stages, staging areas, portable toilets, fencing, signage."],
 ["Motorized equipment or vehicles off road","Vehicles, ATVs, or heavy equipment off established roads."],
 ["Large group or public event","More than about 50 people at once, or open to the public."],
 ["Night activity or lighting","Any activity after sunset or temporary lighting."],
 ["Commercial filming or photography","Paid or commercial video, film, or still photography."],
 ["Utility or right-of-way work","Utility lines, pipes, poles, easements, or right-of-way work."],
 ["Use of drones (UAS)","Any unmanned aircraft launch, landing, or flight."]
];
const IMPACT_NAMES=IMPACTS.map(i=>i[0]);
const PERMIT_TYPES=[
 {title:"Special Event",term:30,prefix:"EVT",template:"SUP_Template_SpecialEvent.docx"},
 {title:"Commercial Filming / Photography",term:60,prefix:"FLM",template:"SUP_Template_Filming.docx"},
 {title:"Right-of-Way / Utility",term:365,prefix:"ROW",template:"SUP_Template_ROW.docx"},
 {title:"Research / Collection",term:365,prefix:"RES",template:"SUP_Template_Research.docx"},
 {title:"Construction / Access",term:180,prefix:"CON",template:"SUP_Template_Construction.docx"},
 {title:"Agricultural Use",term:365,prefix:"AGR",template:"SUP_Template_Agricultural.docx"}
];
const CATEGORIES=["General","Insurance & Liability","Cultural Resources","Soils & Erosion","Water Resources","Wildlife","Vegetation","Public Safety","Operations"];
const ROLES={coord:"Coordinator",comp:"Compliance staff",appr:"Superintendent (approver)",owner:"Program lead (owner)"};
const WHO={coord:"J. Alvarez (coordinator)",comp:"M. Chen (compliance)",appr:"R. Okafor (Superintendent)",owner:"P. Daley (program lead)"};
/* Automatic actors: [plain label, builder note] */
const SYS={
  intake:["Automatic (new application)","Flow F1 New Application (F1a turns the Microsoft Forms response into a Permits item; F1b numbers it, creates the folder and writes AuditLog through F7a)"],
  suggest:[null,"F2 Suggest Conditions (or the app's Suggest button) logs the run to AuditLog through F7a"],
  gen:["Automatic (draft generator)","Flow F3 Generate Draft Permit"],
  send:["Automatic (signature service)","Flow F4 Signature routing (e-signature provider connector)"],
  hook:["Automatic (signature service)","Flow F4 Signature routing: provider 'envelope completed' trigger. Without a trigger (SharePoint eSignature) the coordinator records it"],
  remind:["Automatic (daily reminders)","Flow F6 Daily Reminders"],
  close:["Automatic (close permit)","Flow F5 Close Permit"],
  status:[null,"Flow F7b Status Changed logger (fires on any Status change)"]
};
const CO=["coord","owner"];
const GATE={"start-review":CO,suggest:CO,"edit-cond":CO,"save-cond":CO,"remove-cond":CO,"add-cond":CO,"toggle-cond":CO,"goto-ph":CO,"gen-draft":CO,"regen-yes":CO,"send-sig":CO,"send-yes":CO,"permittee-signed":CO,"begin-compliance":CO,"coi-file":CO,coi:CO,"goto-coi":CO,close:CO,"close-yes":CO,withdraw:CO,deny:CO,"offramp-yes":CO,"edit-details":CO,"save-details":CO,"sp-file":CO,"submit-new":CO,"fill-sample":CO,
  "sup-sign":["appr"],"sup-yes":["appr"],"return-changes":["appr"],"return-yes":["appr"],
  "complete-item":["comp",...CO],"ci-file":["comp",...CO],"ci-save":["comp",...CO],
  "lib-active":["owner"],"lib-yes":["owner"]};

/* ConditionLibrary — from kit/ConditionLibrary-seed.csv */
const L=(code,title,cat,text,types,trig,always,sort)=>({code,title,category:cat,text,types:types?types.split(";"):[],triggers:trig?trig.split(";"):[],always,active:true,sort});
const LIBRARY=[
L("GEN-01","Permit on site","General","The permittee shall keep a copy of this permit, including all conditions and attachments, at the work or activity site at all times and shall present it to any authorized official upon request.","","",true,10),
L("GEN-02","Scope limited to permit","General","Activities are limited to the dates, location, and scope described in this permit. Any change in dates, location, methods, or scope requires written approval before the change is made.","","",true,20),
L("GEN-03","Compliance with laws","General","The permittee shall comply with all applicable federal, state, and local laws, regulations, and ordinances, and shall obtain any other permits or approvals required for the activity.","","",true,30),
L("GEN-04","Site restoration","General","Upon completion of the activity, the permittee shall remove all equipment, materials, and debris and restore the site to its pre-activity condition, or better, to the satisfaction of the issuing office.","","",true,40),
L("INS-01","Certificate of insurance","Insurance & Liability","The permittee shall maintain commercial general liability insurance in the amount specified in the permit for the full term of the permit, naming the issuing agency as additional insured. A current certificate of insurance must be on file before any activity begins.","","",true,50),
L("INS-02","Indemnification","Insurance & Liability","The permittee shall indemnify and hold harmless the issuing agency, its officers, and employees from any claims, damages, or losses arising from the permittee's activities under this permit.","","",true,60),
L("CUL-01","Inadvertent discovery – stop work","Cultural Resources","If any archaeological, historic, or cultural materials, or human remains, are discovered during the activity, the permittee shall immediately stop all work within 100 feet of the discovery, protect the area, and notify the issuing office. Work shall not resume in that area until written authorization is given.","","Ground disturbance",false,100),
L("CUL-02","No collection of artifacts","Cultural Resources","The permittee shall not disturb, remove, or collect any artifacts, historic objects, or cultural materials.","","Ground disturbance;Commercial filming or photography",false,110),
L("SOI-01","Erosion and sediment control","Soils & Erosion","Before any ground disturbance, the permittee shall install and maintain erosion and sediment control measures (such as silt fence, straw wattles, or equivalent) and shall keep them in effective condition until disturbed areas are stabilized.","","Ground disturbance;Utility or right-of-way work",false,200),
L("SOI-02","Topsoil and revegetation","Soils & Erosion","Topsoil removed during excavation shall be stockpiled separately and replaced. Disturbed areas shall be reseeded with an approved native seed mix within 14 days of final grading.","","Ground disturbance",false,210),
L("SOI-03","Wet-weather restriction","Soils & Erosion","Vehicles and equipment shall not operate on saturated soils where ruts deeper than 4 inches would result. Work shall be suspended during such conditions.","","Motorized equipment or vehicles off road",false,220),
L("WAT-01","Riparian buffer protection","Water Resources","No vegetation removal, ground disturbance, equipment staging, or material storage shall occur within 100 feet of any stream, river, or wetland edge unless specifically shown on the approved site plan.","","Near stream, river or wetland",false,300),
L("WAT-02","No refueling within buffer","Water Resources","Fueling, lubrication, and maintenance of vehicles and equipment shall occur at least 100 feet from any stream, river, or wetland. A spill kit shall be kept on site, and any spill shall be reported to the issuing office immediately.","","Near stream, river or wetland;Motorized equipment or vehicles off road",false,310),
L("WLD-01","Tricolored bat seasonal clearing restriction","Wildlife","To protect roosting bats, cutting or removal of trees 3 inches or greater in diameter is prohibited from [START DATE – confirm with biologist] through [END DATE – confirm with biologist]. Any clearing outside this window must be completed as described in the approved site plan.","","Tree clearing",false,400),
L("VEG-01","Tree protection and clearing limits","Vegetation","Clearing limits shall be flagged and approved by the issuing office before any tree cutting. Trees outside the flagged limits shall be protected from damage. Cut material shall be disposed of as directed by the issuing office.","","Tree clearing",false,500),
L("SAF-01","Event safety and crowd management","Public Safety","The permittee shall provide adequate restroom facilities, trash receptacles, first aid, and trained staff for crowd management, and shall keep trails, roads, and emergency access routes open to the public and emergency vehicles at all times.","Special Event","Large group or public event",false,600),
L("SAF-02","Temporary structures","Public Safety","Temporary structures, tents, and stages shall be anchored without stakes deeper than 12 inches unless approved, shall comply with applicable fire and building codes, and shall be removed within 48 hours after the activity ends.","","Structures or temporary facilities",false,610),
L("SAF-03","Night lighting","Public Safety","Night lighting shall be shielded and directed downward, shall be limited to the work or activity area, and shall be turned off no later than the time stated in the permit.","","Night activity or lighting",false,620),
L("OPS-01","Filming and photography operations","Operations","Filming and photography shall not block public access or use of facilities except as approved in the permit. Crew size, vehicles, and equipment shall not exceed the numbers listed in the permit. No props, sets, or special effects may alter natural features.","Commercial Filming / Photography","Commercial filming or photography",false,700),
L("OPS-02","Unmanned aircraft (drones)","Operations","Drone operations shall be conducted by a certified remote pilot in compliance with all applicable aviation regulations, only within the approved area and times, and shall maintain a minimum distance of 100 feet from visitors, wildlife, and structures not involved in the activity.","","Use of drones (UAS)",false,710),
L("OPS-03","Motorized equipment limits","Operations","Motorized vehicles and equipment shall remain on existing roads and the approved access route unless off-road travel is shown on the approved site plan. Equipment shall be free of soil and plant material before entering the site to prevent the spread of invasive species.","","Motorized equipment or vehicles off road",false,720),
L("OPS-04","Utility locate and notification","Operations","Before any excavation, the permittee shall request utility locates through the applicable one-call notification system and shall notify the issuing office at least 5 business days before work begins.","Right-of-Way / Utility;Construction / Access","Utility or right-of-way work;Ground disturbance",false,730)
];

/* ================= dates ================= */
const DAY=86400000;
const pad=n=>String(n).padStart(2,"0");
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const TODAY=sod(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const iso=d=>d?`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`:"";
const fmt=d=>d?d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
const fmtShort=d=>d?d.toLocaleDateString("en-US",{month:"short",day:"numeric"}):"—";
const fmtTime=d=>d?`${fmt(d)}, ${d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}`:"—";
const daysUntil=d=>Math.round((sod(d)-TODAY)/DAY);
const parseISO=s=>{if(!s)return null;const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd);};
/* Sample data was authored against 2026-11-23; every date is shifted by (today − anchor) so reminders stay live. */
const ANCHOR=new Date(2026,10,23);
const SHIFT=Math.round((TODAY-ANCHOR)/DAY);
const sd=s=>s?addDays(parseISO(s),SHIFT):null;
const at=(d,h,m)=>{const x=new Date(d);x.setHours(h,m||0,0,0);return x;};

/* ================= helpers ================= */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shortName=s=>String(s||"").replace(/[~"#%&*:<>?\/\\{|}\s]/g,"").slice(0,30);
const folderName=p=>`${p.number}_${shortName(p.org||p.name)}_${shortName(p.location)}`;
const isClosed=p=>CLOSED_SET.has(p.status);
const folderTop=p=>isClosed(p)?"Closed Projects":"Open Projects";
const statusIdx=s=>STATUSES.indexOf(s);
const typeOf=t=>PERMIT_TYPES.find(x=>x.title===t);
const hlPlaceholders=t=>esc(t).replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>');
const PH_RE=/\[[^\]]+\]/;
const pl=(n,w,ws)=>`${n} ${n===1?w:(ws||w+"s")}`;
const libOf=code=>LIBRARY.find(c=>c.code===code);
const isStd=c=>{const l=libOf(c.code);return !!(l&&l.always);};

function typeLimit(c){return c.types.length?` · only for ${c.types.join(" and ")} permits`:"";}
function suggestFor(type,impacts){
  /* Rule (spec): Active AND (AppliesToTypes empty OR contains type) AND (AlwaysInclude OR TriggerImpacts ∩ Impacts ≠ ∅) */
  const out=[];
  for(const c of LIBRARY.slice().sort((a,b)=>a.sort-b.sort)){
    if(!c.active)continue;
    if(c.types.length&&!c.types.includes(type))continue;
    const hits=c.triggers.filter(t=>impacts.includes(t));
    if(c.always||hits.length){
      out.push({lib:c,why:(c.always?"Standard condition (every permit)":"Triggered by: "+hits.join(", "))+typeLimit(c)});
    }
  }
  return out;
}
/* Library conditions that are not on the permit, each with a one-line reason */
function notSuggested(type,impacts,have){
  return LIBRARY.filter(c=>!have.includes(c.code)).sort((a,b)=>a.sort-b.sort).map(c=>{
    let why;
    if(!c.active)why="Switched off in the library";
    else if(c.types.length&&!c.types.includes(type))why=`Only for ${c.types.join(" and ")} permits`;
    else if(!c.always&&!c.triggers.some(t=>impacts.includes(t)))why=`Only when the project involves: ${c.triggers.join(" or ")}`;
    else why="Would be suggested; not on this permit yet";
    return {lib:c,why};
  });
}

/* ================= records ================= */
let nextId=1;
const permits=[];
function newPermit(o){
  return Object.assign({id:nextId++,conditions:[],docs:[],compliance:[],log:[],draftVersion:0,draftSnapshot:null,sigSent:null,signatureId:"",coordinator:"J. Alvarez",superintendent:"R. Okafor",
    stale:"",returnNote:null,sitePlan:{requested:null,file:null},lastStatus:null,impactsChanged:false,statusSince:null},o);
}
/* AuditLog only holds what the flows write. Everything else goes to SharePoint version history. */
function logEntry(p,kind,type,detail,time,who,how){
  let actor,flow=how||"";
  if(SYS[who]&&SYS[who][0]){actor=SYS[who][0];flow=flow||SYS[who][1];}
  else{actor=WHO[who]||WHO[state.role];if(SYS[who])flow=flow||SYS[who][1];}
  p.log.push({kind,time:time||new Date(),type,detail,actor,flow});
}
function audit(p,type,detail,time,who,how){logEntry(p,"audit",type,detail,time,who,how);}
function ver(p,detail,time,who){logEntry(p,"version","Edited",detail,time,who||state.role,"SharePoint keeps this in the item's version history (not in AuditLog)");}
function addDoc(p,name,docType,time){let n=name,k=2;const dot=name.lastIndexOf(".");while(p.docs.some(d=>d.name===n)){n=name.slice(0,dot)+"_"+(k++)+name.slice(dot);}p.docs.push({name:n,docType,added:time||new Date()});return n;}
function seedConditions(p){
  p.conditions=suggestFor(p.type,p.impacts).map(s=>({code:s.lib.code,title:s.lib.title,category:s.lib.category,text:s.lib.text,source:"Suggested",included:true,why:s.why,sort:s.lib.sort,edited:false}));
}
function fillSampleDates(p){
  p.conditions.forEach(c=>{if(PH_RE.test(c.text)){c.text=c.text.replace(/\[START DATE[^\]]*\]/,"April 1").replace(/\[END DATE[^\]]*\]/,"September 30");c.edited=true;}});
}
function snapshot(p){
  return {v:p.draftVersion,number:p.number,type:p.type,name:p.name,org:p.org,title:p.title,location:p.location,desc:p.desc,start:p.start,end:p.end,expiration:p.expiration,
    conds:p.conditions.filter(c=>c.included).sort((a,b)=>a.sort-b.sort).map(c=>({code:c.code,category:c.category,text:c.text}))};
}
function complianceTemplate(p){
  const items=[{title:"Pre-activity check-in with permittee",due:addDays(p.start,-3)}];
  if(p.impacts.includes("Ground disturbance"))items.push({title:"Erosion control inspection",due:addDays(p.start,7)});
  if(p.impacts.includes("Near stream, river or wetland"))items.push({title:"Riparian buffer spot check",due:addDays(p.start,14)});
  if(p.impacts.includes("Large group or public event"))items.push({title:"Event-day monitoring visit",due:p.start});
  items.push({title:"Final site restoration inspection",due:addDays(p.end,14)});
  return items.map(i=>({title:i.title,due:i.due,completed:false,completedDate:null,note:"",file:"",assigned:"M. Chen (Compliance)"}));
}
const phConds=p=>p.conditions.filter(c=>c.included&&PH_RE.test(c.text));
const coiValid=p=>!!(p.coiReceived&&p.coiExp&&daysUntil(p.coiExp)>=0);
const complianceDone=p=>p.compliance.length>0&&p.compliance.every(c=>c.completed);

const SITE="/sites/SpecialUsePermits/PermitRecords";
function buildSample(r){
  const key=r[0];
  let [number,type,status,name,org,email,phone,title,desc,loc,imp,rcv,st,en,exp,coi,coiExp,psig,ssig,cc,closed]=r;
  number=number.replace(/^SUP-\d{4}/,"SUP-"+sd(rcv).getFullYear());
  const p=newPermit({key,number,type,status,name,org,email,phone,title,desc,location:loc,impacts:imp.split(";"),
    received:sd(rcv),start:sd(st),end:sd(en),expiration:sd(exp),coiReceived:coi,coiExp:sd(coiExp),
    permitteeSigned:sd(psig),supSigned:sd(ssig),closedDate:sd(closed)});
  const si=statusIdx(status),R=p.received,off=OFFRAMPS.includes(status),ST=SYS.status[1];
  audit(p,"Created","Application received from the online form. Permit folder created in Open Projects. Site plan requested from the applicant by email.",at(R,9,14),"intake");
  p.sitePlan.requested=at(R,9,14);
  if(["SUP-2026-0004","SUP-2026-0008","SUP-2026-0010"].includes(key)){const d=at(addDays(R,1),11,20);p.sitePlan.file=addDoc(p,`${number}_SitePlan_1.pdf`,"Site plan",d);audit(p,"Document added",`${p.sitePlan.file} (site plan emailed by the applicant)`,d,"coord");}
  if(si>=1||off)audit(p,"Status changed","Received → Under Review",at(addDays(R,2),10,2),"coord",ST);
  if(key==="SUP-2026-0011"){
    seedConditions(p);
    audit(p,"Conditions suggested",`Suggestion run: ${p.conditions.length} added`,at(addDays(R,3),14,38),"coord",SYS.suggest[1]);
    p.conditions.push({code:"VEG-01",title:"Tree protection and clearing limits",category:"Vegetation",text:"Detectors shall be attached to trees with non-penetrating straps only. No limbs shall be cut or trimmed to place or access detectors.",source:"Added by staff",included:true,why:"",sort:500,edited:true});
    ver(p,"VEG-01 added from the library; wording edited for this permit",at(addDays(R,3),14,40),"coord");
  }
  if(status==="Denied"){p.lastStatus="Under Review";audit(p,"Status changed","Under Review → Denied. Reason: stream crossing not consistent with the management plan.",at(p.closedDate,11,20),"coord",ST);}
  if(status==="Withdrawn"){p.lastStatus="Under Review";const cd=addDays(p.closedDate,-1);const n=addDoc(p,`${number}_Correspondence_${iso(cd)}.pdf`,"Correspondence",at(cd,15,5));audit(p,"Document added",`${n} (applicant's withdrawal email)`,at(cd,15,5),"coord");audit(p,"Status changed","Under Review → Withdrawn. Reason: applicant withdrew by email.",at(p.closedDate,8,50),"coord",ST);}
  if(off)audit(p,"Moved to Closed","Permit folder moved to Closed Projects",at(p.closedDate,8,52),"close");
  if(si>=2){
    const sent=p.permitteeSigned?addDays(p.permitteeSigned,-5):(status==="Out for Permittee Signature"?addDays(TODAY,-9):null);
    const draftDate=sent?addDays(sent,-2):addDays(TODAY,-4);
    seedConditions(p);fillSampleDates(p);
    const n=p.conditions.length;
    audit(p,"Conditions suggested",`Suggestion run: ${n} added`,at(addDays(R,3),10,15),"coord",SYS.suggest[1]);
    if(p.conditions.some(c=>c.edited))ver(p,"WLD-01 wording edited for this permit (clearing dates filled in)",at(addDays(R,3),10,30),"coord");
    p.draftVersion=key==="SUP-2026-0010"?2:1;
    for(let v=1;v<=p.draftVersion;v++){const dd=addDays(draftDate,v-p.draftVersion);addDoc(p,`${number}_DraftPermit_v${v}.docx`,"Draft permit",at(dd,13,30));audit(p,"Document added",`${number}_DraftPermit_v${v}.docx created from the ${type} Word template with ${n} conditions`,at(dd,13,30),"gen");}
    audit(p,"Status changed","Under Review → Draft Permit",at(addDays(draftDate,1-p.draftVersion),13,31),"gen");
    p.draftSnapshot=snapshot(p);
    if(si>=3){
      p.sigSent=sent;p.signatureId="ENV-"+number.slice(-4)+"-7C2"+number.slice(-1);
      audit(p,"Signature sent",`Draft v${p.draftVersion} sent to ${email} for e-signature`,at(sent,9,5),"send");
      audit(p,"Status changed","Draft Permit → Out for Permittee Signature",at(sent,9,5),"send");
    }
    if(si>=3&&si<5&&!p.permitteeSigned&&daysUntil(sent)<=-7)audit(p,"Reminder sent",`Signature reminder emailed to ${email}`,at(addDays(sent,7),7,0),"remind");
    if(p.permitteeSigned){
      audit(p,"Signed",`Permittee signed (${name})`,at(p.permitteeSigned,16,22),"hook");
      audit(p,"Status changed","Out for Permittee Signature → Out for Superintendent Signature",at(p.permitteeSigned,16,22),"hook");
    }
    if(p.supSigned){
      audit(p,"Signed","Superintendent signed (R. Okafor)",at(p.supSigned,11,3),"hook");
      addDoc(p,`${number}_Executed.pdf`,"Executed permit",at(p.supSigned,11,4));
      audit(p,"Document added",`${number}_Executed.pdf saved; copy emailed to the permittee`,at(p.supSigned,11,4),"hook");
      audit(p,"Status changed","Out for Superintendent Signature → Executed",at(p.supSigned,11,4),"hook");
    }
  }
  if(p.coiReceived){
    const d=p.supSigned?addDays(p.supSigned,-3):(p.permitteeSigned?p.permitteeSigned:addDays(TODAY,-6));
    const n=addDoc(p,`${number}_COI_exp${iso(p.coiExp)}.pdf`,"Insurance certificate",at(d,10,40));
    audit(p,"Document added",`${n} (insurance certificate)`,at(d,10,40),"coord");
    ver(p,`Insurance certificate recorded; expires ${fmt(p.coiExp)}`,at(d,10,41),"coord");
  }
  if(si>=6){
    audit(p,"Status changed","Executed → Active",at(addDays(p.supSigned,1),9,0),"coord",ST);
    p.compliance=complianceTemplate(p);
    p.compliance.forEach((c,i)=>{
      const overdueDemo=key==="SUP-2026-0014"&&i===1;
      if((status==="Closed"||daysUntil(c.due)<0)&&!overdueDemo){
        c.completed=true;c.completedDate=addDays(c.due,status==="Closed"?0:1);if(p.closedDate&&c.completedDate>=p.closedDate)c.completedDate=addDays(p.closedDate,-1);
        c.note="Checked on site; no issues found.";
        c.file=addDoc(p,`${number}_Compliance_${iso(c.completedDate)}.pdf`,"Compliance record",at(c.completedDate,15,10));
        audit(p,"Document added",`${c.file} (compliance record: ${c.title})`,at(c.completedDate,15,10),"comp");
        ver(p,`Compliance item completed: ${c.title}`,at(c.completedDate,15,11),"comp");
      }
    });
    if(key==="SUP-2026-0014")p.compliance[1].due=addDays(TODAY,-4);
  }
  if(status==="Closed"){
    audit(p,"Status changed","Active → Closed",at(p.closedDate,10,0),"coord",ST);
    audit(p,"Moved to Closed","Permit folder moved to Closed Projects",at(p.closedDate,10,1),"close");
  }
  p.log.sort((a,b)=>a.time-b.time);
  const lastSt=p.log.filter(e=>e.type==="Status changed").pop();p.statusSince=lastSt?lastSt.time:p.received;
  return p;
}

/* ================= derived ================= */
const isOpen=p=>!isClosed(p);
const unexecuted=p=>isOpen(p)&&statusIdx(p.status)<5;
function reasons(p){
  const out=[];
  if(isClosed(p))return out;
  const si=statusIdx(p.status);
  const lvl=d=>d<=7?"crit":"warn";const dd=n=>pl(n,"day");
  if(unexecuted(p)&&p.start){const d=daysUntil(p.start);if(d<=30)out.push({label:d<0?`Start date passed ${dd(-d)} ago, not fully signed`:d===0?"Starts today, not fully signed":`Starts in ${dd(d)}, not fully signed`,level:lvl(d),days:d,date:p.start,kind:"due"});}
  if(p.coiReceived&&p.coiExp){const d=daysUntil(p.coiExp);if(d<=30)out.push({label:d<0?`Insurance certificate expired ${dd(-d)} ago`:`Insurance certificate expires in ${dd(d)}`,level:lvl(d),days:d,date:p.coiExp,kind:"due"});}
  if(!p.coiReceived&&si>=2){const d=p.start?daysUntil(p.start):99;out.push({label:"No insurance certificate on file",level:d<=14?"crit":"warn",days:Math.min(d,60),date:p.start,kind:"due"});}
  if(si>=5&&p.expiration){const d=daysUntil(p.expiration);if(d<=60)out.push({label:d<0?`Permit expired ${dd(-d)} ago`:`Permit expires in ${dd(d)}`,level:d<=7?"crit":"warn",days:d,date:p.expiration,kind:"due"});}
  if(p.status==="Out for Permittee Signature"&&p.sigSent){const w=-daysUntil(p.sigSent);if(w>=7)out.push({label:`Waiting on permittee signature for ${dd(w)}`,level:"warn",days:30-w,date:p.sigSent,kind:"wait"});}
  if(p.status==="Out for Superintendent Signature")out.push({label:"Waiting for Superintendent signature",level:"info",days:20,date:p.permitteeSigned,kind:"wait"});
  p.compliance.filter(c=>!c.completed&&daysUntil(c.due)<0).forEach(c=>out.push({label:`Compliance item overdue: ${c.title}`,level:"crit",days:daysUntil(c.due),date:c.due,kind:"due"}));
  if(p.status==="Received"){const a=-daysUntil(p.received);out.push({label:a>=5?`New application, ${dd(a)} old: start review`:"New application: start review",level:"info",days:a>=5?10:25,date:p.received,kind:"wait"});}
  if(p.status==="Under Review"&&p.statusSince){const a=-daysUntil(p.statusSince);if(a>=10)out.push({label:`Under review for ${dd(a)}`,level:"warn",days:30-a,date:p.statusSince,kind:"wait"});}
  return out;
}
const RANK={crit:0,warn:1,info:2};
const sortedReasons=p=>reasons(p).sort((a,b)=>RANK[a.level]-RANK[b.level]||a.days-b.days);
const urgency=p=>{const r=reasons(p);if(!r.length)return Infinity;return Math.min(...r.map(x=>RANK[x.level]*1000+x.days));};
const DQ=[
  ["all","All",()=>true],
  ["unsigned30","Starts within 30 days, not fully signed",p=>unexecuted(p)&&p.start&&daysUntil(p.start)<=30],
  ["coi","Insurance certificate (COI) missing or expiring",p=>(statusIdx(p.status)>=2&&!p.coiReceived)||(p.coiReceived&&p.coiExp&&daysUntil(p.coiExp)<=30)],
  ["awaiting","Waiting for signature",p=>p.status.startsWith("Out for")],
  ["exp60","Permit expires within 60 days",p=>statusIdx(p.status)>=5&&p.expiration&&daysUntil(p.expiration)<=60],
  ["overdue","Compliance overdue",p=>p.compliance.some(c=>!c.completed&&daysUntil(c.due)<0)],
  ["review","New or slow reviews",p=>p.status==="Received"||(p.status==="Under Review"&&-daysUntil(p.statusSince)>=10)]
];
const pill=s=>`<span class="pill status">${esc(s)}</span>`;

/* ---------- "what just happened" message strip ---------- */
let msgTimer=null;
function say(plain,howText,kind){
  state.msg={plain,how:howText||"",kind:kind||""};
  const live=document.getElementById("live");live.textContent="";setTimeout(()=>{live.textContent=plain;},40);
  clearTimeout(msgTimer);msgTimer=setTimeout(clearMsg,state.how&&howText?9000:4500);
}
function clearMsg(){
  state.msg=null;const el=document.getElementById("msg");if(!el)return;
  const had=el.contains(document.activeElement);el.remove();
  if(had){const t=visiblePrimary()||document.getElementById("app");t.focus({preventScroll:true});}
}
function msgHTML(){const m=state.msg;if(!m)return"";
  return `<div class="msgstrip ${m.kind}" id="msg" tabindex="-1"><div class="grow"><b>${esc(m.plain)}</b>${state.how&&m.how?`<div class="hownote">${esc(m.how)}</div>`:""}</div><button type="button" class="x" data-act="dismiss-msg" aria-label="Dismiss message">×</button></div>`;}

/* ================= dashboard (per role) ================= */
function tile(r){
  if(!r.date)return `<div class="when ${r.level||""}"><span class="k">Now</span></div>`;
  const dn=daysUntil(r.date);
  const rel=r.kind==="wait"?(dn===0?"today":pl(-dn,"day")):(dn===0?"today":dn>0?"in "+pl(dn,"day"):pl(-dn,"day")+" ago");
  return `<div class="when ${r.level||""}"><span class="k">${r.kind==="wait"?"Waiting since":"Due"}</span>${esc(fmt(r.date))}<small>${rel}</small></div>`;
}
function queueItem(p){const r=sortedReasons(p);
  return `<li><a href="#permit-${p.id}">${tile(r[0])}<div class="t"><span class="mono">${esc(p.number)}</span>${pill(p.status)}<span class="sub">${esc(p.title)} · ${esc(p.org)}</span></div>
  <div class="reasons">${r.map(x=>`<span class="pill ${x.level}">${esc(x.label)}</span>`).join("")}</div></a></li>`;}
function statusCard(){
  return `<section class="card" aria-labelledby="st-h"><div class="card-head"><h2 id="st-h">Permits by status</h2><p>${permits.length} permits this year</p></div>
  <ul class="stages">${STATUSES.concat(OFFRAMPS).map(s=>`<li><a href="#permits" data-act="filter-status" data-arg="${esc(s)}">${esc(s)}<span class="c">${permits.filter(p=>p.status===s).length}</span></a></li>`).join("")}</ul></section>`;
}

const FIXED_SIZE_NOTE="The Power App itself is typically built at one fixed size; this mock-up's phone layout and dark mode only show how the screens could adapt.";
function viewDashboard(){
  if(state.role==="appr")return dashAppr();
  if(state.role==="comp")return dashComp();
  const open=permits.filter(isOpen);
  const queue=open.filter(p=>reasons(p).length).sort((a,b)=>urgency(a)-urgency(b));
  const chips=DQ.map(([k,l,t])=>({k,l,n:queue.filter(t).length})).filter(c=>c.k==="all"||c.n);
  if(!chips.some(c=>c.k===state.dq))state.dq="all";
  const shown=queue.filter(DQ.find(d=>d[0]===state.dq)[2]);
  const ms=[];
  open.forEach(p=>{
    const add=(d,label)=>{if(d){const n=daysUntil(d);if(n>=0&&n<=30)ms.push({d,n,p,label});}};
    if(unexecuted(p)||statusIdx(p.status)===5)add(p.start,"Activity starts");

const SORTS={number:["Permit #",p=>p.number],title:["Project / applicant",p=>p.title.toLowerCase()],type:["Type",p=>p.type],location:["Location",p=>p.location],
  status:["Status",p=>{const i=statusIdx(p.status);return i<0?99:i;}],received:["Received",p=>+p.received],start:["Start",p=>p.start?+p.start:0],expiration:["Expires",p=>p.expiration?+p.expiration:0]};
function filteredPermits(){
  const f=state.pf;const q=f.q.trim().toLowerCase();const s=state.sort;const g=SORTS[s.key][1];
  return permits.filter(p=>{
    if(f.type&&p.type!==f.type)return false;
    if(f.status&&p.status!==f.status)return false;
    if(f.loc&&p.location!==f.loc)return false;
    if(f.from&&(!p.expiration||iso(p.expiration)<f.from))return false;
    if(f.to&&(!p.expiration||iso(p.expiration)>f.to))return false;
    if(q&&![p.number,p.name,p.org,p.title,p.location].join(" ").toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>{const x=g(a),y=g(b);return ((x<y?-1:x>y?1:0)*s.dir)||(b.received-a.received);});
}
function sortTh(k){const s=state.sort,on=s.key===k;
  return `<th${["received","start","expiration"].includes(k)?' class="nowrap"':""} aria-sort="${on?(s.dir>0?"ascending":"descending"):"none"}"><button type="button" class="sortbtn" id="sort-${k}" data-act="sort" data-arg="${k}">${SORTS[k][0]}<span class="ar${on?"":" off"}" aria-hidden="true">${on?(s.dir>0?"↑":"↓"):"↕"}</span></button></th>`;}
function permitsTable(){

  ${rows.map(p=>`<tr class="rowlink" data-href="#permit-${p.id}"><td class="nowrap"><a class="mono" href="#permit-${p.id}">${esc(p.number)}</a></td><td class="proj">${esc(p.title)}<div class="sub">${esc(p.org)} · ${esc(p.name)}</div></td><td>${esc(p.type)}</td><td>${esc(p.location)}</td><td>${pill(p.status)}</td><td class="nowrap num">${esc(fmt(p.received))}</td><td class="nowrap num">${esc(fmt(p.start))}</td><td class="nowrap num">${esc(fmt(p.expiration))}</td></tr>`).join("")}
  ${rows.length?"":`<tr><td colspan="8" class="muted">No permits match these filters.</td></tr>`}
  </tbody></table></div>
  <ul class="pcards" aria-label="Permits">${rows.map(p=>`<li><a href="#permit-${p.id}"><div class="top"><span class="mono">${esc(p.number)}</span>${pill(p.status)}</div><div class="ti">${esc(p.title)}</div><div class="meta">${esc(p.org||p.name)} · ${esc(p.type)}</div><div class="meta">Starts ${esc(fmt(p.start))} · Expires ${esc(fmt(p.expiration))}</div></a></li>`).join("")}${rows.length?"":`<li class="empty">No permits match these filters.</li>`}</ul>
  <div class="muted" style="padding:10px 16px;font-size:.82rem">${rows.length} of ${permits.length} permits · sorted by ${SORTS[state.sort.key][0].toLowerCase()} (${state.sort.dir>0?"ascending":"descending"})</div>`;

/* ================= permit record ================= */
function stepper(p){
  const off=OFFRAMPS.includes(p.status);
  const si=off?Math.max(0,statusIdx(p.lastStatus||"Received")):statusIdx(p.status);
  const items=STATUSES.map((s,i)=>{let c="";if(off)c=i<=si?"done":"";else{c=i<si?"done":i===si?"cur":"";if(p.status==="Closed"&&i===si)c="done";}
    return `<li class="${c}"${!off&&i===si?' aria-current="step"':""}>${esc(s)}</li>`;}).join("");
  const compact=off?`<b>${esc(p.status)}</b> · stopped at step ${si+1} of ${STATUSES.length} (${esc(STATUSES[si])})`:`Step ${si+1} of ${STATUSES.length} · <b>${esc(p.status)}</b>`;
  return `<ol class="stepper" aria-label="Permit progress">${items}${off?`<li class="off cur" aria-current="step">${esc(p.status)}</li>`:""}</ol><p class="stepc">${compact}</p>`;
}
function viewBtn(p){if(!p.draftSnapshot)return"";return btn("preview",p.supSigned?"View executed permit":`Open draft v${p.draftVersion} (opens in Word in the real app)`);}
function moreMenu(p){
  const i=statusIdx(p.status);if(!can("withdraw")||i<0||i>=5)return"";
  return `<div class="more${state.moreOpen?" open":""}"><button type="button" class="btn more-btn" data-act="more" aria-expanded="${state.moreOpen}" aria-controls="more-items">More…</button><div class="more-items" id="more-items">${btn("withdraw","Withdraw")}${btn("deny","Deny",{cls:"danger"})}</div></div>`;
}
/* One sentence about the next step for this role, and at most one primary button */
function nextStep(p){
  const R=state.role,co=isCo(),s=p.status,b=[];let t="";
  const incl=p.conditions.filter(c=>c.included).length,ph=phConds(p),ok=coiValid(p);
  const days=n=>pl(n,"day");
  const coiLine=ok?"":(p.coiReceived?` The insurance certificate (COI) expired on ${fmt(p.coiExp)}; a current one is needed before the Superintendent signs.`:" The insurance certificate (COI) still needs to be recorded before the Superintendent can sign.");
  if(isClosed(p)){t=`${s} on ${fmt(p.closedDate)}. The record is read-only.`;b.push(viewBtn(p));return {t,b};}
  switch(s){
  case "Received":
    if(co){t="New application. Next: start the review.";b.push(btn("start-review","Start review",{cls:"primary"}),btn("edit-details","Edit details"));}
    else t=`New application, received ${fmt(p.received)}. The coordinator starts the review.`;
    break;
  case "Under Review":{
    const n=-daysUntil(p.statusSince);
    if(co){
      if(!incl){t="Next: suggest conditions, then generate the draft.";b.push(btn("suggest","Suggest conditions",{cls:"primary"}));}
      else if(ph.length){t=`Next: fill in the dates in ${pl(ph.length,"condition")}, then generate the draft.`;b.push(btn("goto-ph","Fill in condition dates",{cls:"primary"}),btn("suggest","Re-run suggestions"));}
      else{t=`${pl(incl,"condition")} ready. Next: generate the draft permit.`;b.push(btn("gen-draft","Generate draft permit",{cls:"primary"}),btn("suggest","Re-run suggestions"));}
      b.push(btn("edit-details","Edit details"));
      if(n>=10)t=`Under review for ${days(n)}. `+t;
    } else t=`Under review by ${p.coordinator} for ${days(n)}.`;
    break;}
  case "Draft Permit":{
    const ret=p.returnNote?`Returned for changes by ${p.returnNote.by} on ${fmt(p.returnNote.date)}: “${p.returnNote.note}”. `:"";
    if(co){
      if(ph.length){t=ret+`Next: fill in the dates in ${pl(ph.length,"condition")}, then regenerate the draft.`;b.push(btn("goto-ph","Fill in condition dates",{cls:"primary"}));}
      else if(p.stale){t=ret+`${p.stale} Next: regenerate the draft (v${p.draftVersion+1}) before sending.`;b.push(btn("gen-draft",`Regenerate draft (v${p.draftVersion+1})`,{cls:"primary"}));}
      else{t=ret+`Draft v${p.draftVersion} is ready. Next: check it, then send it for signature.`;b.push(btn("send-sig","Send for signature",{cls:"primary"}),btn("gen-draft",`Regenerate draft (v${p.draftVersion+1})`));}
      b.push(viewBtn(p),btn("edit-details","Edit details"));
    } else {t=ret+`Draft v${p.draftVersion} is being prepared by ${p.coordinator}.`;b.push(viewBtn(p));}
    break;}
  case "Out for Permittee Signature":{
    const n=-daysUntil(p.sigSent);
    t=`Waiting on the permittee (${p.name}) to sign in the e-signature tool. Sent ${n===0?"today":days(n)+" ago"}.`;
    if(co){t+=coiLine;if(!ok)b.push(btn("goto-coi","Record insurance certificate",{cls:"primary"}));b.push(btn("permittee-signed","Simulate: permittee signs (in the e-signature tool)",{cls:"sim"}),viewBtn(p));}
    else{if(R==="appr")t+=" You'll get an email from the e-signature tool when it's your turn.";b.push(viewBtn(p));}
    break;}
  case "Out for Superintendent Signature":{
    if(R==="appr"){
      if(ok){t="Ready for your signature. Review the permit, then sign it in the e-signature tool.";b.push(btn("sup-sign","Simulate: Superintendent signs (in the e-signature tool)",{cls:"primary sim"}),btn("return-changes","Return for changes"),viewBtn(p));}
      else{t=`Not ready to sign yet: ${p.coiReceived?"the insurance certificate (COI) has expired":"no insurance certificate (COI) is on file"}. The coordinator has to record a current one first. You can also return it for changes.`;b.push(btn("return-changes","Return for changes"),viewBtn(p));}
    } else {
      const n=-daysUntil(p.permitteeSigned);
      t=`Waiting on ${p.superintendent} to sign, since ${fmt(p.permitteeSigned)} (${n===0?"today":days(n)}).`;
      if(co){t+=coiLine;if(!ok)b.push(btn("goto-coi","Record insurance certificate",{cls:"primary"}));}
      b.push(viewBtn(p));
    }
    break;}
  case "Executed":
    t="Executed (signed by both parties).";
    if(co){t+=" Next: begin compliance monitoring.";b.push(btn("begin-compliance","Begin compliance monitoring",{cls:"primary"}));}
    else t+=" Compliance monitoring starts when the coordinator begins it.";
    b.push(viewBtn(p));break;
  case "Active":{
    const open=p.compliance.filter(c=>!c.completed);const nx=open.slice().sort((a,c)=>a.due-c.due)[0];
    if(!open.length){t="All compliance items are done.";if(co){t+=" Next: close the permit.";b.push(btn("close","Close permit",{cls:"primary"}));}else t+=" The coordinator closes the permit.";}
    else{t=`${open.length} of ${pl(p.compliance.length,"compliance item")} open; next due ${fmt(nx.due)}.`;
      if(co){t+=" Close the permit when all are done.";b.push(btn("goto-compliance","Go to compliance items",{cls:"primary"}),btn("close","Close permit"));}
      else if(R==="comp")b.push(btn("goto-compliance","Go to compliance items",{cls:"primary"}));}
    b.push(viewBtn(p));break;}
  }
  return {t,b};
}
function confirmBox(p){
  const c=state.confirm;if(!c)return"";

  if(c==="close")return `<div class="confirm" role="group" aria-labelledby="cf-h"><div class="grow"><b id="cf-h">Close ${esc(p.number)}?</b> The permit folder moves to Closed Projects and the record becomes read-only.${open?` <b>${pl(open,"compliance item is","compliance items are")} still open.</b>`:""}</div><button class="btn primary" type="button" data-act="close-yes" id="close-yes">Close permit</button>${no}</div>`;
  if(c==="withdraw"||c==="deny"){const d=c==="deny";
    return `<div class="confirm crit" role="group" aria-labelledby="cf-h"><div class="grow field"><label for="offramp-reason"><b id="cf-h">${d?"Deny":"Withdraw"} ${esc(p.number)}</b>: reason (required; saved to the audit trail and emailed to the applicant)</label>
    <input type="text" id="offramp-reason" aria-describedby="offramp-reason-err"${invalid("offramp-reason")} value="${esc(state.pending.reason||"")}" placeholder="${d?"e.g. Activity not consistent with the management plan":"e.g. Applicant withdrew by email"}">${errSpan("offramp-reason")}</div>
    <button class="btn danger" type="button" data-act="offramp-yes" data-arg="${c}" id="offramp-yes">${d?"Deny permit":"Withdraw permit"}</button>${no}</div>`;}

  if(c==="send")return `<div class="confirm" role="group" aria-labelledby="cf-h"><div class="grow"><b id="cf-h">Send draft v${p.draftVersion} for signature?</b> ${esc(p.name)} (${esc(p.email)}) gets an email from the e-signature tool and signs there. ${esc(p.superintendent)} signs after them.</div><button class="btn primary" type="button" data-act="send-yes" id="send-yes">Send for signature</button>${no}</div>`;
  if(c==="sup"){const n=p.draftSnapshot?p.draftSnapshot.conds.length:0;
    return `<div class="confirm" role="group" aria-labelledby="cf-h"><div class="grow"><b id="cf-h">Sign ${esc(p.number)}?</b><ul>
    <li>Permittee: ${esc(p.name)}${p.org?", "+esc(p.org):""} (signed ${esc(fmt(p.permitteeSigned))})</li><li>Activity: ${esc(fmt(p.start))} to ${esc(fmt(p.end))}; permit expires ${esc(fmt(p.expiration))}</li>
    <li>${pl(n,"condition")}</li><li>Insurance certificate (COI) expires ${esc(fmt(p.coiExp))}</li></ul>
    <div class="row mt8">${btn("preview","View permit",{cls:"small"})}<span style="font-size:.86rem">In the real app you sign on the e-signature tool's page, not here.</span></div></div>
    <button class="btn primary" type="button" data-act="sup-yes" id="sup-yes">Sign (simulated)</button>${no}</div>`;}
  if(c==="return")return `<div class="confirm crit" role="group" aria-labelledby="cf-h"><div class="grow field"><label for="return-note"><b id="cf-h">Return ${esc(p.number)} for changes</b>: what needs to change? (required; sent to the coordinator)</label>
    <textarea id="return-note" style="min-height:64px" aria-describedby="return-note-err"${invalid("return-note")}>${esc(state.pending.retnote||"")}</textarea>${errSpan("return-note")}</div>
    <button class="btn danger" type="button" data-act="return-yes" id="return-yes">Return for changes</button>${no}</div>`;
  return"";
}
function viewRecord(p){
  if(!p)return `<div class="card card-pad">Permit not found. <a href="#permits">Back to permits</a></div>`;
  const auditN=p.log.filter(e=>e.kind==="audit").length;
  const tabs=[["details","Details"],["conditions","Conditions",p.conditions.filter(c=>c.included).length],["documents","Documents",p.docs.length],["signatures","Signatures"],["compliance","Compliance items",p.compliance.length],["audit","Audit trail",auditN]];

  return `<p class="back"><a href="#permits">← Permits</a></p>

function archive(){
  /* deterministic extra closed records so the 12-month charts have realistic volume */
  let s=20261123;const rnd=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;
  const out=[];const base={"Special Event":22,"Commercial Filming / Photography":15,"Right-of-Way / Utility":48,"Research / Collection":30,"Construction / Access":41,"Agricultural Use":26};
  for(let i=0;i<64;i++){const t=PERMIT_TYPES[Math.floor(rnd()*6)].title;const r=addDays(TODAY,-Math.floor(rnd()*360)-3);const days=Math.round(base[t]*(0.7+rnd()*0.6));out.push({type:t,received:r,executed:daysUntil(addDays(r,days))<=0?addDays(r,days):null});}
  return out;
}

function svgBarsV(data,W,label){

  const bars=data.map((d,i)=>{const h=(d.v/top)*ih;const x=ml+i*bw+bw*0.18;const w=bw*0.64;const cx=(x+w/2).toFixed(1);
    return `<rect class="${d.cur?"bar2":"bar"}" x="${x.toFixed(1)}" y="${(mt+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${esc(d.label)}: ${d.v}</title></rect>${d.v?`<text class="val" x="${cx}" y="${(mt+ih-h-5).toFixed(1)}" text-anchor="middle">${d.v}</text>`:""}<text x="${cx}" y="${H-mb+16}" text-anchor="middle">${esc(d.label)}</text>${d.sub&&bw>=44?`<text x="${cx}" y="${H-mb+32}" text-anchor="middle">${esc(d.sub)}</text>`:""}`;}).join("");
  return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${bars}<line class="axis" x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}"/></svg>`;
}
function svgBarsH(data,W,o){
  const max=Math.max(1,...data.map(d=>d.v));const unit=o.unit||"";
  if(W<520){const row=44,mr=64;const H=data.length*row+6;
    return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${data.map((d,i)=>{const y=i*row;const w=(d.v/max)*(W-mr);
      return `<text x="0" y="${y+15}">${esc(d.label)}</text><rect class="bar" x="0" y="${y+21}" width="${Math.max(d.v?2:0,w).toFixed(1)}" height="14" rx="2"><title>${esc(d.label)}: ${d.v}${unit}</title></rect><text class="val" x="${(w+6).toFixed(1)}" y="${y+33}">${d.v}${unit}</text>`;}).join("")}</svg>`;}
  const row=34,ml=Math.min(240,Math.round(W*.45)),mr=64,mt=8;const H=mt+data.length*row+8;

}

function render(){
  const h=(location.hash||"#dashboard").slice(1);const same=lastRoute===h;
  const prev=document.activeElement;

  const type=g("f-type");const start=parseISO(g("f-start"));const end=parseISO(g("f-end"));
  const p=newPermit({number:`SUP-${yr}-${String(seq).padStart(4,"0")}`,type,status:"Received",name:g("f-name"),org:g("f-org"),email:g("f-email"),phone:g("f-phone"),title:g("f-title"),desc:g("f-desc"),location:g("f-loc"),impacts:imps,
    received:TODAY,start,end,expiration:addDays(start,typeOf(type).term),coiReceived:false,coiExp:null,permitteeSigned:null,supSigned:null,closedDate:null,statusSince:new Date()});
  p.sitePlan.requested=new Date();
  audit(p,"Created",`Application entered by ${WHO[state.role]}. Permit folder created in Open Projects. Site plan requested from the applicant by email.`,null,state.role,SYS.intake[1]);
  permits.push(p);state.newResult=p.id;state.lastNew=null;
  say(`${p.number} created. It has no conditions yet; they are added during review.`,"F1b numbers every new Permits item from Settings.NextSeq, creates the folder and sends the acknowledgement email.");
  state.focusAfter="#new-h";render();
});

document.getElementById("role-select").value=state.role;
render();
