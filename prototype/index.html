.toast{background:var(--surface);border:1px solid var(--border-strong);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);font-size:.85rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;animation:tin .18s ease-out}
.toast b{font-weight:600}
.toast .flow{grid-column:1;color:var(--text-2);font-size:.8rem}
.toast button{grid-row:1/span 2;grid-column:2;border:0;background:none;cursor:pointer;color:var(--muted);font-size:1.1rem;align-self:start}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.modal{background:var(--surface);border-radius:10px;width:min(820px,100%);box-shadow:var(--shadow);border:1px solid var(--border)}
.modal .card-head{position:sticky;top:0;background:var(--surface);border-radius:10px 10px 0 0;z-index:1}
.docpaper{background:var(--doc-paper);color:var(--doc-ink);margin:16px;padding:32px clamp(16px,5vw,48px);border:1px solid var(--border);border-radius:4px;font-family:"IBM Plex Sans",Georgia,serif;font-size:.9rem}
.docpaper h2{text-align:center;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.docpaper .center{text-align:center;margin:4px 0 18px;font-size:.85rem}
.docpaper table{font-size:.85rem;margin-bottom:18px}
.docpaper th,.docpaper td{border-bottom:1px solid var(--border-strong);background:transparent;color:var(--doc-ink);text-transform:none;letter-spacing:0;font-size:.85rem;padding:6px 8px}
.docpaper th{width:34%;font-weight:600}
.docpaper ol{padding-left:1.4em}
.docpaper ol li{margin-bottom:10px}
.docpaper .cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
.docpaper .sigline{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
.docpaper .sigline div{border-top:1px solid var(--doc-ink);padding-top:4px;font-size:.8rem}
.docpaper .ph{background:transparent;color:inherit;border-bottom:2px dotted currentColor;border-radius:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb16{margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rt-results{list-style:none;margin:0;padding:0}
.rt-results li{padding:8px 0;border-top:1px solid var(--border);font-size:.86rem}

.switch{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:.82rem}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

const DAY=86400000;
const pad=n=>String(n).padStart(2,"0");
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};

function suggestFor(type,impacts){
  /* Rule (spec): Active AND (AppliesToTypes empty OR contains type) AND (AlwaysInclude OR TriggerImpacts ∩ Impacts ≠ ∅) */
  const out=[];
  for(const c of LIBRARY.slice().sort((a,b)=>a.sort-b.sort)){
    if(!c.active)continue;
    if(c.types.length&&!c.types.includes(type))continue;
    const hits=c.triggers.filter(t=>impacts.includes(t));
    if(c.always||hits.length){
      out.push({lib:c,why:c.always?"Always included"+(c.types.length?` for ${c.types.join(", ")}`:""):"Triggered by: "+hits.join(", ")});
    }
  }
  return out;
}

function newPermit(o){

function audit(p,type,detail,time,actor){p.audit.push({time:time||new Date(),type,detail,actor:actor||ACTORS[state.role]});}
function addDoc(p,name,docType,time){let n=name,k=2;const dot=name.lastIndexOf(".");while(p.docs.some(d=>d.name===n)){n=name.slice(0,dot)+"_"+(k++)+name.slice(dot);}p.docs.push({name:n,docType,added:time||new Date()});return n;}
function seedConditions(p,time){
  p.conditions=suggestFor(p.type,p.impacts).map((s,i)=>({code:s.lib.code,title:s.lib.title,category:s.lib.category,text:s.lib.text,source:"Suggested",included:true,why:s.why,sort:s.lib.sort}));
}
function complianceTemplate(p){
  const items=[{title:"Pre-activity check-in with permittee",due:addDays(p.start,-3)}];
  if(p.impacts.includes("Ground disturbance"))items.push({title:"Erosion control inspection",due:addDays(p.start,7)});
  if(p.impacts.includes("Near stream, river or wetland"))items.push({title:"Riparian buffer spot check",due:addDays(p.start,14)});
  if(p.impacts.includes("Large group or public event"))items.push({title:"Event-day monitoring visit",due:p.start});
  items.push({title:"Final site restoration inspection",due:addDays(p.end,14)});
  return items.map(i=>({title:i.title,due:i.due,completed:false,completedDate:null,assigned:"M. Chen (Compliance)"}));
}

    seedConditions(p);
    p.conditions.push({code:"VEG-01",title:"Tree protection and clearing limits",category:"Vegetation",text:"Detectors shall be attached to trees with non-penetrating straps only. No limbs shall be cut or trimmed to place or access detectors.",source:"Added by staff",included:true,why:"Added by staff (edited)",sort:500});
    audit(p,"Field Changed",`Conditions suggested (${p.conditions.length-1}); VEG-01 added by staff with edited text`,at(addDays(R,3),14,40),C);
  }
  if(status==="Denied"){audit(p,"Status Changed","Under Review → Denied. Reason: stream crossing not consistent with management plan.",at(p.closedDate,11,20),C);}
  if(status==="Withdrawn"){addDoc(p,`${number}_Correspondence_${iso(addDays(p.closedDate,-1))}.pdf`,"Correspondence",at(addDays(p.closedDate,-1),15,5));audit(p,"Status Changed","Under Review → Withdrawn (applicant request by email)",at(p.closedDate,8,50),C);}
  if(off){audit(p,"Moved to Closed",`Folder moved to Permit Records/Closed Projects/${folderName(p)}`,at(p.closedDate,8,52),"flow: SUP-Close");}
  if(si>=2){
    const sent=p.permitteeSigned?addDays(p.permitteeSigned,-5):(status==="Out for Permittee Signature"?addDays(TODAY,-9):null);
    const draftDate=sent?addDays(sent,-2):addDays(TODAY,-4);
    seedConditions(p);
    p.draftVersion=number==="SUP-2026-0010"?2:1;
    for(let v=1;v<=p.draftVersion;v++){const dd=addDays(draftDate,v-p.draftVersion);addDoc(p,`${number}_DraftPermit_v${v}.docx`,"Draft Permit",at(dd,13,30));audit(p,"Document Added",`${number}_DraftPermit_v${v}.docx generated from ${typeOf(type).template} with ${p.conditions.length} conditions`,at(dd,13,30),"flow: SUP-GenerateDraft");}
    audit(p,"Status Changed","Under Review → Draft Permit",at(addDays(draftDate,1-p.draftVersion),13,31),C);
    if(si>=3){
      p.sigSent=sent;p.signatureId="ENV-"+number.slice(-4)+"-7C2"+number.slice(-1);
      audit(p,"Signature Sent",`DraftPermit_v${p.draftVersion} sent to ${email} for e-signature (request ${p.signatureId})`,at(sent,9,5),"flow: SUP-SendForSignature");
      audit(p,"Status Changed","Draft Permit → Out for Permittee Signature",at(sent,9,5),"flow: SUP-SendForSignature");
    }
    if(si>=3&&si<5&&!p.permitteeSigned&&daysUntil(sent)<=-7){audit(p,"Reminder Sent",`Signature reminder sent to ${email}`,at(addDays(sent,7),7,0),"flow: SUP-DailyReminders");}
    if(p.permitteeSigned){
      audit(p,"Signed",`Permittee signed (${name})`,at(p.permitteeSigned,16,22),"flow: SUP-SignatureWebhook");
      audit(p,"Status Changed","Out for Permittee Signature → Out for Superintendent Signature",at(p.permitteeSigned,16,22),"flow: SUP-SignatureWebhook");
    }
    if(p.supSigned){
      audit(p,"Signed","Superintendent signed (R. Okafor)",at(p.supSigned,11,3),"flow: SUP-SignatureWebhook");
      addDoc(p,`${number}_Executed.pdf`,"Executed Permit",at(p.supSigned,11,4));
      audit(p,"Document Added",`${number}_Executed.pdf saved; copy emailed to permittee`,at(p.supSigned,11,4),"flow: SUP-SignatureWebhook");
      audit(p,"Status Changed","Out for Superintendent Signature → Executed",at(p.supSigned,11,4),"flow: SUP-SignatureWebhook");
    }
  }
  if(p.coiReceived){
    const d=p.supSigned?addDays(p.supSigned,-3):(p.permitteeSigned?p.permitteeSigned:addDays(TODAY,-6));
    addDoc(p,`${number}_COI_exp${iso(p.coiExp)}.pdf`,"COI",at(d,10,40));
    audit(p,"Field Changed",`COIReceived = Yes; COIExpiration = ${iso(p.coiExp)}`,at(d,10,41),C);
  }
  if(si>=6){
    const ad=addDays(p.supSigned,1);
    audit(p,"Status Changed","Executed → Active",at(ad,9,0),C);
    p.compliance=complianceTemplate(p);
    p.compliance.forEach((c,i)=>{
      const overdueDemo=number==="SUP-2026-0014"&&i===1;
      if((status==="Closed"||daysUntil(c.due)<0)&&!overdueDemo){c.completed=true;c.completedDate=addDays(c.due,status==="Closed"?0:1);if(p.closedDate&&c.completedDate>=p.closedDate)c.completedDate=addDays(p.closedDate,-1);
        addDoc(p,`${number}_Compliance_${iso(c.completedDate)}.pdf`,"Compliance Record",at(c.completedDate,15,10));
        audit(p,"Field Changed",`Compliance item completed: ${c.title}`,at(c.completedDate,15,10),CP);}
    });
    if(number==="SUP-2026-0014"){p.compliance[1].due=addDays(TODAY,-4);}
  }
  if(status==="Closed"){
    audit(p,"Status Changed","Active → Closed",at(p.closedDate,10,0),C);
    audit(p,"Moved to Closed",`Folder moved to Permit Records/Closed Projects/${folderName(p)}`,at(p.closedDate,10,1),"flow: SUP-Close");
  }
  p.audit.sort((a,b)=>a.time-b.time);
  return p;
}

/* ================= state ================= */
const state={role:"coord",tab:"details",confirm:null,pf:{q:"",type:"",status:"",loc:"",from:"",to:"",quick:""},cf:{q:"",cat:""},rt:{type:"Construction / Access",imp:["Ground disturbance","Tree clearing"]},editCond:null,suggestRun:null,newResult:null,lastNew:null};
RAW.forEach(r=>permits.push(buildSample(r)));
const byId=id=>permits.find(p=>p.id===id);

/* ================= derived ================= */
const isOpen=p=>!isClosed(p);
const unexecuted=p=>isOpen(p)&&statusIdx(p.status)<5;
function reasons(p){
  const out=[];
  if(isClosed(p))return out;
  const si=statusIdx(p.status);
  const lvl=d=>d<=7?"crit":"warn";
  if(unexecuted(p)&&p.start){const d=daysUntil(p.start);if(d<=30)out.push({label:d<0?`Start passed ${-d}d ago — not executed`:`Starts in ${d}d — not executed`,level:lvl(d),days:d,date:p.start});}
  if(p.coiReceived&&p.coiExp){const d=daysUntil(p.coiExp);if(d<=30)out.push({label:d<0?`COI expired ${-d}d ago`:`COI expires in ${d}d`,level:lvl(d),days:d,date:p.coiExp});}
  if(!p.coiReceived&&si>=2){const d=p.start?daysUntil(p.start):99;out.push({label:"COI not on file",level:d<=14?"crit":"warn",days:Math.min(d,60),date:p.start});}
  if(si>=5&&p.expiration){const d=daysUntil(p.expiration);if(d<=60)out.push({label:d<0?`Permit expired ${-d}d ago`:`Permit expires in ${d}d`,level:d<=7?"crit":"warn",days:d,date:p.expiration});}
  if(p.status==="Out for Permittee Signature"&&p.sigSent){const w=-daysUntil(p.sigSent);if(w>=7)out.push({label:`Awaiting permittee signature ${w}d`,level:"warn",days:30-w,date:p.sigSent});}
  if(p.status==="Out for Superintendent Signature"){out.push({label:"Awaiting Superintendent signature",level:"info",days:20,date:p.permitteeSigned});}
  p.compliance.filter(c=>!c.completed&&daysUntil(c.due)<0).forEach(c=>out.push({label:`Compliance overdue: ${c.title}`,level:"crit",days:daysUntil(c.due),date:c.due}));
  if(p.status==="Received"){const a=-daysUntil(p.received);out.push({label:a>=5?`New application ${a}d — start review`:"New application — start review",level:"info",days:a>=5?10:25,date:p.received});}
  return out;
}
const urgency=p=>{const r=reasons(p);if(!r.length)return Infinity;const rank={crit:0,warn:1,info:2};return Math.min(...r.map(x=>rank[x.level]*1000+x.days));};
const QUICK={
  open:{label:"Open permits",test:isOpen},
  awaiting:{label:"Awaiting signature",test:p=>p.status==="Out for Permittee Signature"||p.status==="Out for Superintendent Signature"},
  coi30:{label:"COI expiring ≤ 30 days",test:p=>isOpen(p)&&p.coiReceived&&p.coiExp&&daysUntil(p.coiExp)<=30},
  unexec30:{label:"Unexecuted, start ≤ 30 days",test:p=>unexecuted(p)&&p.start&&daysUntil(p.start)<=30},
  exp60:{label:"Expiring ≤ 60 days",test:p=>isOpen(p)&&statusIdx(p.status)>=5&&p.expiration&&daysUntil(p.expiration)<=60&&daysUntil(p.expiration)>=0}
};
function statusClass(s){
  if(s==="Received"||s==="Under Review")return"info";
  if(s==="Draft Permit")return"accent";
  if(s.startsWith("Out for"))return"warn";
  if(s==="Executed"||s.startsWith("Active"))return"good";
  if(s==="Withdrawn"||s==="Denied")return"crit";
  return"";
}
const STAGE_COLOR=["var(--info)","var(--info)","var(--accent)","var(--warn)","var(--warn)","var(--good)","var(--good)","var(--border-strong)"];
const pill=(s)=>`<span class="pill ${statusClass(s)}">${esc(s)}</span>`;

/* ================= permissions ================= */
const PERM={"sup-sign":["appr"],"complete-item":["comp"]};
function can(act){const allowed=PERM[act]||["coord"];return{ok:allowed.includes(state.role),need:allowed.map(r=>ROLES[r]).join(" / ")};}
function btn(act,label,o){o=o||{};const c=can(act);const dis=!c.ok||o.disabled;
  const why=!c.ok?`Requires role: ${c.need}`:(o.why||"");
  return `<button type="button" class="btn ${o.cls||""}" data-act="${act}" ${o.arg!=null?`data-arg="${esc(o.arg)}"`:""} ${dis?"disabled":""} ${why?`title="${esc(why)}"`:""}>${label}${!c.ok?` <span class="lock">· ${esc(c.need.split(" (")[0])} only</span>`:""}</button>`;}

/* ================= toasts ================= */
function toast(title,flow){
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
  t.innerHTML=`<b>${esc(title)}</b><span class="flow">${esc(flow)}</span><button type="button" aria-label="Dismiss">×</button>`;
  t.querySelector("button").onclick=()=>t.remove();
  const box=document.getElementById("toasts");box.appendChild(t);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>t.remove(),7000);
}

  const open=permits.filter(isOpen);

        const nd=top.date;const dn=nd?daysUntil(nd):0;
        return `<li><a href="#permit-${p.id}"><div class="when ${top.level}">${nd?`${esc(fmtShort(nd))}<small>${dn===0?"today":dn>0?"in "+dn+"d":(-dn)+"d ago"}</small>`:`<small>now</small>`}</div>
        <div class="t"><span class="mono">${esc(p.number)}</span>${pill(p.status)}<span class="sub">${esc(p.title)} · ${esc(p.org)}</span></div>
        <div class="reasons">${r.map(x=>`<span class="pill ${x.level}">${esc(x.label)}</span>`).join("")}</div></a></li>`;}).join("")}</ul>`:`<div class="empty">Nothing needs attention.</div>`}
    </section>
    <div class="grid" style="align-content:start">
      <section class="card" aria-labelledby="p-h">
        <div class="card-head"><h2 id="p-h">Status pipeline</h2><p>${total} permits this year</p></div>
        <div class="pipeline">
          <div class="stagebar" role="img" aria-label="Permits by status">${STATUSES.map((s,i)=>counts[i]?`<span style="flex:${counts[i]};background:${STAGE_COLOR[i]}" title="${esc(s)}: ${counts[i]}"></span>`:"").join("")}${OFFRAMPS.map((s,i)=>offc[i]?`<span style="flex:${offc[i]};background:var(--crit)" title="${s}: ${offc[i]}"></span>`:"").join("")}</div>
          <ul class="stages">${STATUSES.map((s,i)=>`<li><a href="#permits" data-act="filter-status" data-arg="${esc(s)}"><span class="sw" style="background:${STAGE_COLOR[i]}"></span>${esc(s)}<span class="c">${counts[i]}</span></a></li>`).join("")}
          ${OFFRAMPS.map((s,i)=>`<li><a href="#permits" data-act="filter-status" data-arg="${s}"><span class="sw" style="background:var(--crit)"></span>${s}<span class="c">${offc[i]}</span></a></li>`).join("")}</ul>
        </div>

        <div class="card-head"><h2 id="m-h">Next 30 days</h2><p>${ms.length} milestones</p></div>

function filteredPermits(){
  const f=state.pf;const q=f.q.trim().toLowerCase();
  return permits.filter(p=>{
    if(f.quick&&!QUICK[f.quick].test(p))return false;
    if(f.type&&p.type!==f.type)return false;
    if(f.status&&p.status!==f.status)return false;
    if(f.loc&&p.location!==f.loc)return false;
    if(f.from&&(!p.expiration||iso(p.expiration)<f.from))return false;
    if(f.to&&(!p.expiration||iso(p.expiration)>f.to))return false;
    if(q&&![p.number,p.name,p.org,p.title,p.location].join(" ").toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>b.received-a.received);
}

  const rows=filteredPermits();

  <div class="tablewrap"><table class="permtable"><thead><tr><th>Permit #</th><th>Project / applicant</th><th>Type</th><th>Location</th><th>Status</th><th class="nowrap">Start</th><th class="nowrap">Expires</th></tr></thead><tbody>

}

/* ---------- permit record ---------- */
function stepper(p){
  const si=statusIdx(p.status);const off=OFFRAMPS.includes(p.status);
  let reached=-1;if(off){reached=p.conditions.length?2:1;}
  return `<ol class="stepper" aria-label="Lifecycle">${STATUSES.map((s,i)=>{
    let c="";if(off){c=i<=reached?"done":"";} else {c=i<si?"done":(i===si?"cur":"");}
    if(p.status==="Closed"&&i===si)c="done";
    return `<li class="${c}" ${i===si?'aria-current="step"':""}>${esc(s)}</li>`;}).join("")}
  ${off?`<li class="off cur" aria-current="step">${esc(p.status)}</li>`:""}</ol>`;
}
function primaryActions(p){
  const s=p.status;const a=[];
  const coiWhy=!p.coiReceived?"COI must be on file before the Superintendent can execute":"";
  if(s==="Received")a.push(btn("start-review","Start review",{cls:"primary"}));
  if(s==="Under Review")a.push(btn("suggest","Suggest conditions"));
  if(s==="Under Review")a.push(btn("gen-draft","Generate draft permit",{cls:"primary",disabled:!p.conditions.some(c=>c.included),why:"Add or suggest conditions first"}));
  if(s==="Draft Permit"){a.push(btn("gen-draft",`Regenerate draft (v${p.draftVersion+1})`));a.push(btn("send-sig","Send for signature",{cls:"primary"}));}
  if(s==="Draft Permit"||s==="Out for Permittee Signature"||s.startsWith("Out for Sup")||s==="Executed"||s==="Active"||s==="Under Review")if(p.draftVersion)a.push(btn("preview","View draft v"+p.draftVersion));
  if(s==="Out for Permittee Signature")a.push(btn("permittee-signed","Record permittee signed",{cls:"primary"}));
  if(s==="Out for Superintendent Signature")a.push(btn("sup-sign","Superintendent signs",{cls:"primary",disabled:!p.coiReceived,why:coiWhy}));
  if(s==="Executed")a.push(btn("begin-compliance","Begin compliance monitoring",{cls:"primary"}));
  if(s==="Active")a.push(btn("close","Close permit",{cls:"primary"}));
  if(statusIdx(s)>=0&&statusIdx(s)<5){a.push(btn("withdraw","Withdraw"));a.push(btn("deny","Deny",{cls:"danger"}));}
  return a.join("");
}
function confirmBox(p){
  const c=state.confirm;if(!c)return"";

  if(c==="withdraw"||c==="deny")return `<div class="confirm crit" role="alert"><div class="grow field"><label for="offramp-reason"><b>${c==="deny"?"Deny":"Withdraw"} ${esc(p.number)}</b> — reason (saved to the audit trail)</label><input type="text" id="offramp-reason" placeholder="${c==="deny"?"e.g. Activity not consistent with management plan":"e.g. Applicant withdrew by email"}"></div><button class="btn danger" type="button" data-act="offramp-yes" data-arg="${c}">${c==="deny"?"Deny permit":"Withdraw permit"}</button><button class="btn" type="button" data-act="confirm-no">Cancel</button></div>`;
  return"";
}

/* ---------- reports ---------- */
function archive(){
  /* deterministic extra closed records so the 12-month charts have realistic volume */
  let s=20261123;const rnd=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;
  const out=[];const base={"Special Event":22,"Commercial Filming / Photography":15,"Right-of-Way / Utility":48,"Research / Collection":30,"Construction / Access":41,"Agricultural Use":26};
  for(let i=0;i<64;i++){const t=PERMIT_TYPES[Math.floor(rnd()*6)].title;const r=addDays(TODAY,-Math.floor(rnd()*360)-3);const days=Math.round(base[t]*(0.7+rnd()*0.6));out.push({type:t,received:r,executed:daysUntil(addDays(r,days))<=0?addDays(r,days):null});}
  return out;
}
const ARCHIVE=archive();
function svgBarsV(data,o){
  const W=640,H=250,ml=36,mr=8,mt=18,mb=36;const max=Math.max(1,...data.map(d=>d.v));const step=max<=6?1:max<=12?2:5;const top=Math.ceil(max/step)*step;
  const iw=W-ml-mr,ih=H-mt-mb,bw=iw/data.length;
  let g="";for(let y=0;y<=top;y+=step){const yy=mt+ih-(y/top)*ih;g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}"/><text x="${ml-6}" y="${yy+4}" text-anchor="end">${y}</text>`;}
  const bars=data.map((d,i)=>{const h=(d.v/top)*ih;const x=ml+i*bw+bw*0.18;const w=bw*0.64;return `<rect class="${d.cur?"bar2":"bar"}" x="${x.toFixed(1)}" y="${(mt+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${esc(d.label)}: ${d.v}</title></rect>${d.v?`<text class="val" x="${(x+w/2).toFixed(1)}" y="${(mt+ih-h-5).toFixed(1)}" text-anchor="middle">${d.v}</text>`:""}<text x="${(x+w/2).toFixed(1)}" y="${H-mb+16}" text-anchor="middle">${esc(d.label)}</text>${d.sub?`<text x="${(x+w/2).toFixed(1)}" y="${H-mb+30}" text-anchor="middle" style="font-size:10px;fill:var(--muted)">${esc(d.sub)}</text>`:""}`;}).join("");
  return `<svg class="chart wide" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}${bars}<line class="axis" x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}"/></svg>`;
}
function svgBarsH(data,o){
  const W=560,row=34,ml=o.ml||220,mr=48,mt=8;const H=mt+data.length*row+8;const max=Math.max(1,...data.map(d=>d.v));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${data.map((d,i)=>{const y=mt+i*row;const w=(d.v/max)*(W-ml-mr);
    return `<text x="${ml-10}" y="${y+row/2+4}" text-anchor="end">${esc(d.label)}</text><rect x="${ml}" y="${y+7}" width="${Math.max(d.v?2:0,w).toFixed(1)}" height="${row-14}" rx="2" style="fill:${d.color||"var(--chart-1)"}"><title>${esc(d.label)}: ${d.v}${o.unit||""}</title></rect><text class="val" x="${(ml+w+6).toFixed(1)}" y="${y+row/2+4}">${d.v}${o.unit||""}</text>`;}).join("")}
    <line class="axis" x1="${ml}" x2="${ml}" y1="${mt}" y2="${H-8}"/></svg>`;
}
function viewReports(){
  const all=permits.map(p=>({type:p.type,received:p.received,executed:p.supSigned})).concat(ARCHIVE);
  const months=[];for(let i=11;i>=0;i--){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);months.push(d);}
  const perMonth=months.map((m,i)=>({label:m.toLocaleDateString("en-US",{month:"short"}),sub:(i===0||m.getMonth()===0)?String(m.getFullYear()):"",cur:i===11,v:all.filter(r=>r.received.getFullYear()===m.getFullYear()&&r.received.getMonth()===m.getMonth()).length}));
  const avg=PERMIT_TYPES.map(t=>{const ex=all.filter(r=>r.type===t.title&&r.executed);const v=ex.length?Math.round(ex.reduce((a,r)=>a+(r.executed-r.received)/DAY,0)/ex.length):0;return{label:t.title,v,n:ex.length};});
  const sb=STATUSES.concat(OFFRAMPS).map((s,i)=>({label:s,v:permits.filter(p=>p.status===s).length,color:i<8?STAGE_COLOR[i]:"var(--crit)"}));
  return `<div class="page-head"><div><h1>Reports</h1><p>Monthly volume and turnaround include ${ARCHIVE.length} archived sample records in addition to the ${permits.length} permits in this mock-up.</p></div></div>
  <div class="grid">
    <section class="card"><div class="card-head"><h2>Applications received per month</h2><p>Last 12 months · current month to date shown muted</p></div><div class="chartwrap">${svgBarsV(perMonth,{label:"Applications received per month"})}</div></section>
    <div class="grid dash-grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))">
      <section class="card"><div class="card-head"><h2>Average days, received → executed</h2><p>By permit type</p></div><div class="chartwrap">${svgBarsH(avg,{label:"Average days from received to executed by type",unit:" d",ml:230})}</div>
      <div class="muted" style="padding:0 16px 14px;font-size:.8rem">Based on ${avg.reduce((a,b)=>a+b.n,0)} executed permits.</div></section>
      <section class="card"><div class="card-head"><h2>Status breakdown</h2><p>Current records</p></div><div class="chartwrap">${svgBarsH(sb,{label:"Permits by status",ml:240})}</div></section>
    </div>
  </div>`;
}

/* ================= router ================= */
let lastRoute="";
function render(){
  const h=(location.hash||"#dashboard").slice(1);
  let html,nav=h;
  const m=h.match(/^permit-(\d+)$/);
  if(m){const id=Number(m[1]);if(lastRoute!==h){state.confirm=null;state.editCond=null;state.suggestRun=null;}html=viewRecord(byId(id));nav="permits";}
  else if(h==="permits")html=viewPermits();
  else if(h==="new")html=viewNew();
  else if(h==="conditions")html=viewConditions();
  else if(h==="reports")html=viewReports();
  else{html=viewDashboard();nav="dashboard";}
  const app=document.getElementById("app");app.innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",false));
  const cur=document.querySelector(`[data-nav="${nav}"]`);if(cur)cur.setAttribute("aria-current","page");
  if(lastRoute!==h){window.scrollTo(0,0);if(lastRoute)app.focus({preventScroll:true});}
  lastRoute=h;
}
function currentPermit(){const m=(location.hash||"").match(/^#permit-(\d+)$/);return m?byId(Number(m[1])):null;}

/* ================= actions ================= */
function setStatus(p,to,actor){audit(p,"Status Changed",`${p.status} → ${to}`,null,actor);p.status=to;}
const ACT={
  quick(p,arg){state.pf={q:"",type:"",status:"",loc:"",from:"",to:"",quick:arg};location.hash="#permits";},
  "filter-status"(p,arg){state.pf={q:"",type:"",status:arg,loc:"",from:"",to:"",quick:""};},
  "clear-quick"(){state.pf.quick="";document.getElementById("permits-results").innerHTML=permitsTable();},
  tab(p,arg){state.tab=arg;render();const t=document.getElementById("tab-"+arg);if(t)t.focus();},
  "start-review"(p){setStatus(p,"Under Review");render();toast("Review started","Status change is logged to AuditLog by the 'SUP – Status Change' flow; applicant gets an 'under review' email.");},
  suggest(p){
    const sugg=suggestFor(p.type,p.impacts);let added=0,kept=0;
    sugg.forEach(s=>{const ex=p.conditions.find(c=>c.code===s.lib.code);if(ex){kept++;ex.why=ex.source==="Added by staff"?ex.why:s.why;}else{added++;p.conditions.push({code:s.lib.code,title:s.lib.title,category:s.lib.category,text:s.lib.text,source:"Suggested",included:true,why:s.why,sort:s.lib.sort});}});
    if(added&&p.draftVersion)p.condDirty=true;
    state.suggestRun={id:p.id,added,kept};state.tab="conditions";
    audit(p,"Field Changed",`Suggest conditions: ${added} added, ${kept} already present (rule on type + ${p.impacts.length} impacts)`);
    render();toast(`${added} condition(s) suggested`,"In Power Apps, 'Suggest conditions' filters ConditionLibrary with the rule and writes rows to PermitConditions (Source = Suggested).");
  },
  "edit-cond"(p,arg){state.editCond=arg;render();const t=document.getElementById("ct-"+arg);if(t)t.focus();},
  "cancel-cond"(){state.editCond=null;render();},
  "save-cond"(p,arg){const c=p.conditions.find(x=>x.code===arg);const v=document.getElementById("ct-"+arg).value.trim();if(v&&v!==c.text){c.text=v;c.why=c.why.includes("(edited)")?c.why:c.why+" (edited)";if(p.draftVersion)p.condDirty=true;audit(p,"Field Changed",`${arg} text edited for this permit`);toast(`${arg} text saved`,"PermitConditions.ConditionText is a per-permit snapshot; the library wording is unchanged.");}state.editCond=null;render();},
  "remove-cond"(p,arg){p.conditions=p.conditions.filter(c=>c.code!==arg);if(p.draftVersion)p.condDirty=true;audit(p,"Field Changed",`${arg} removed`);render();toast(`${arg} removed`,"The staff-added PermitConditions row is deleted; the library is unchanged.");},
  "add-cond"(p){const code=document.getElementById("add-cond-sel").value;const l=LIBRARY.find(c=>c.code===code);if(!l)return;p.conditions.push({code,title:l.title,category:l.category,text:l.text,source:"Added by staff",included:true,why:"Added by staff",sort:l.sort});if(p.draftVersion)p.condDirty=true;audit(p,"Field Changed",`${code} added from library by staff`);render();toast(`${code} added`,"New PermitConditions row with Source = Added by staff.");},
  "gen-draft"(p){
    p.draftVersion++;const name=`${p.number}_DraftPermit_v${p.draftVersion}.docx`;const n=p.conditions.filter(c=>c.included).length;
    addDoc(p,name,"Draft Permit");audit(p,"Document Added",`${name} generated from ${typeOf(p.type).template} with ${n} conditions`,null,"flow: SUP-GenerateDraft");
    if(p.status!=="Draft Permit")setStatus(p,"Draft Permit","flow: SUP-GenerateDraft");
    p.condDirty=false;render();openPreview(p);
    toast(`${name} created`,`Flow 'Generate Draft Permit' fills the Word template's content controls, inserts ${n} numbered conditions, and saves the file to ${folderTop(p)}/${folderName(p)}.`);
  },
  preview(p){openPreview(p);},
  "send-sig"(p){
    p.sigSent=new Date();p.signatureId="ENV-"+p.number.slice(-4)+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
    audit(p,"Signature Sent",`DraftPermit_v${p.draftVersion} sent to ${p.email} (request ${p.signatureId})`,null,"flow: SUP-SendForSignature");
    setStatus(p,"Out for Permittee Signature","flow: SUP-SendForSignature");state.tab="signatures";render();
    toast("Sent for signature",`Flow creates an e-signature request: ${p.email} signs first, then ${p.superintendent}. SignatureRequestId is stored on the permit.`);
  },
  "permittee-signed"(p){p.permitteeSigned=new Date();audit(p,"Signed",`Permittee signed (${p.name})`,null,"flow: SUP-SignatureWebhook");setStatus(p,"Out for Superintendent Signature","flow: SUP-SignatureWebhook");render();
    toast("Permittee signature recorded","The e-sign webhook flow sets PermitteeSigned and emails the Superintendent that the permit is ready to sign.");},
  "sup-sign"(p){p.supSigned=new Date();audit(p,"Signed",`Superintendent signed (${p.superintendent})`,null,"flow: SUP-SignatureWebhook");
    addDoc(p,`${p.number}_Executed.pdf`,"Executed Permit");audit(p,"Document Added",`${p.number}_Executed.pdf saved; copy emailed to permittee`,null,"flow: SUP-SignatureWebhook");
    setStatus(p,"Executed","flow: SUP-SignatureWebhook");render();
    toast("Permit executed",`Flow saves ${p.number}_Executed.pdf to the folder, emails the permittee a copy, and starts expiry reminders.`);},
  "begin-compliance"(p){p.compliance=complianceTemplate(p).map(c=>({...c,due:daysUntil(c.due)<1?addDays(TODAY,7):c.due}));setStatus(p,"Active");state.tab="compliance";render();
    toast(`${p.compliance.length} compliance items created`,"Rows added to ComplianceItems and assigned to SUP Compliance; due-date reminders come from the daily flow.");},
  coi(p){const v=document.getElementById("coi-exp").value;if(!v){toast("Enter the COI expiration date","The COIExpiration column drives the 30/7-day reminders.");return;}
    p.coiReceived=true;p.coiExp=parseISO(v);const name=addDoc(p,`${p.number}_COI_exp${v}.pdf`,"COI");audit(p,"Document Added",name);audit(p,"Field Changed",`COIReceived = Yes; COIExpiration = ${v}`);render();
    toast("COI recorded",`File saved as ${name}; reminders scheduled at 30 and 7 days before ${v}.`);},
  "complete-item"(p,arg){const c=p.compliance[Number(arg)];c.completed=true;c.completedDate=TODAY;addDoc(p,`${p.number}_Compliance_${iso(TODAY)}.pdf`,"Compliance Record");audit(p,"Field Changed",`Compliance item completed: ${c.title}`);
    if(p.compliance.every(x=>x.completed)){p.complianceComplete=true;audit(p,"Field Changed","ComplianceComplete = Yes");}
    render();toast("Compliance item completed","ComplianceItems row updated with CompletedDate; evidence file saved with the Compliance_{date} name.");},
  close(){state.confirm="close";render();},
  withdraw(){state.confirm="withdraw";render();const i=document.getElementById("offramp-reason");if(i)i.focus();},
  deny(){state.confirm="deny";render();const i=document.getElementById("offramp-reason");if(i)i.focus();},
  "confirm-no"(){state.confirm=null;render();},
  "close-yes"(p){p.closedDate=TODAY;setStatus(p,"Closed");audit(p,"Moved to Closed",`Folder moved to Permit Records/Closed Projects/${folderName(p)}`,null,"flow: SUP-Close");state.confirm=null;state.tab="documents";render();
    toast("Permit closed","Flow 'Close Permit' moves the folder to Closed Projects and updates FolderPath / FolderUrl.");},
  "offramp-yes"(p,arg){const r=(document.getElementById("offramp-reason").value||"").trim()||"No reason given";const to=arg==="deny"?"Denied":"Withdrawn";p.closedDate=TODAY;
    audit(p,"Status Changed",`${p.status} → ${to}. Reason: ${r}`);p.status=to;audit(p,"Moved to Closed",`Folder moved to Permit Records/Closed Projects/${folderName(p)}`,null,"flow: SUP-Close");state.confirm=null;state.tab="documents";render();
    toast(`Permit ${to.toLowerCase()}`,`Applicant notified by email; folder moved to Closed Projects.`);},
  "close-modal"(){closeModal();},
  "fill-sample"(){state.lastNew={"f-type":"Special Event","f-name":"Avery Quinlan","f-org":"Maple Hollow Trail Club","f-email":"avery@example.org","f-phone":"555-0199","f-title":"Spring trail-cleanup day & picnic","f-desc":"Volunteer trail cleanup for about 80 people, followed by a picnic with a pop-up tent near the creek. Small trail tread repairs with hand tools.","f-loc":"Willow Creek Picnic Area","f-start":iso(addDays(TODAY,60)),"f-end":iso(addDays(TODAY,60)),imps:["Ground disturbance","Near stream, river or wetland","Structures or temporary facilities","Large group or public event"]};render();},
  "new-again"(){state.newResult=null;state.lastNew=null;render();}
};
const ROLE_GATED=new Set(["start-review","suggest","edit-cond","save-cond","remove-cond","add-cond","gen-draft","send-sig","permittee-signed","sup-sign","begin-compliance","coi","complete-item","close","withdraw","deny","close-yes","offramp-yes"]);

document.addEventListener("click",e=>{
  const modalInner=e.target.closest("[data-stop]");const el=e.target.closest("[data-act]");
  if(el&&el.dataset.act==="close-modal"&&modalInner&&!el.closest(".card-head")){return;}
  if(el){
    const act=el.dataset.act;if(!ACT[act])return;
    if(el.tagName==="A"&&act!=="filter-status")e.preventDefault();
    if(ROLE_GATED.has(act)){const c=can(act==="close-yes"||act==="offramp-yes"?"close":act);if(!c.ok){toast("Not permitted for this role",`Requires: ${c.need}. In the real app the button is hidden and the SharePoint permission blocks the write.`);return;}}
    const p=currentPermit();ACT[act](p,el.dataset.arg);return;
  }
  const tr=e.target.closest("tr[data-href]");if(tr&&!e.target.closest("a")){location.hash=tr.dataset.href;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("modal-root").innerHTML)closeModal();});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="role-select"){state.role=t.value;state.confirm=null;state.editCond=null;render();toast(`Viewing as ${ROLES[state.role]}`,"Role maps to a SharePoint group (SUP Coordinators / SUP Compliance / SUP Approving Officials); the app shows or hides actions per group.");return;}
  if(t.dataset.change==="toggle-cond"){const p=currentPermit();const c=p.conditions.find(x=>x.code===t.dataset.arg);c.included=t.checked;if(p.draftVersion)p.condDirty=true;audit(p,"Field Changed",`${c.code} ${t.checked?"included":"excluded"}`);render();toast(`${c.code} ${t.checked?"included":"excluded"}`,"PermitConditions.Included updated; only included conditions go into the generated draft.");const n=document.getElementById("inc-"+c.code);if(n)n.focus();return;}
  if(t.dataset.change==="lib-active"){const c=LIBRARY.find(x=>x.code===t.dataset.arg);c.active=t.checked;document.getElementById("lib-results").innerHTML=libTable();document.getElementById("rt-results").innerHTML=rtResults();const n=document.getElementById("act-"+c.code);if(n)n.focus();toast(`${c.code} ${c.active?"activated":"deactivated"}`,"Inactive conditions are never suggested; existing permits keep their snapshot text.");return;}
  if(t.id==="rt-type"||t.hasAttribute("data-rt-imp")){state.rt.type=document.getElementById("rt-type").value;state.rt.imp=[...document.querySelectorAll("[data-rt-imp]:checked")].map(x=>x.value);document.getElementById("rt-results").innerHTML=rtResults();return;}
  const pfMap={"pf-type":"type","pf-status":"status","pf-loc":"loc","pf-from":"from","pf-to":"to"};
  if(pfMap[t.id]){state.pf[pfMap[t.id]]=t.value;document.getElementById("permits-results").innerHTML=permitsTable();return;}
  if(t.id==="cf-cat"){state.cf.cat=t.value;document.getElementById("lib-results").innerHTML=libTable();}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="pf-q"){state.pf.q=t.value;document.getElementById("permits-results").innerHTML=permitsTable();}
  if(t.id==="cf-q"){state.cf.q=t.value;document.getElementById("lib-results").innerHTML=libTable();}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id!=="new-form")return;
  if(!can("submit-new").ok){toast("Not permitted for this role","Requires: Coordinator.");return;}
  const g=id=>document.getElementById(id).value.trim();
  const req=["f-name","f-email","f-title","f-desc","f-loc","f-start","f-end"];let bad=null;
  req.forEach(id=>{const er=document.getElementById(id+"-err");const ok=!!g(id)&&(id!=="f-email"||/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g(id)));if(er)er.textContent=ok?"":(id==="f-email"&&g(id)?"Enter a valid email":"Required");document.getElementById(id).setAttribute("aria-invalid",String(!ok));if(!ok&&!bad)bad=id;});
  if(!bad&&g("f-end")<g("f-start")){document.getElementById("f-end-err").textContent="End must be on or after start";bad="f-end";}
  if(bad){document.getElementById(bad).focus();return;}
  const imps=[...document.querySelectorAll(".imp input:checked")].map(x=>x.value);
  const yr=TODAY.getFullYear();
  const seq=Math.max(0,...permits.filter(p=>p.number.startsWith(`SUP-${yr}-`)).map(p=>Number(p.number.slice(-4))))+1;
  const type=g("f-type");const start=parseISO(g("f-start"));const end=parseISO(g("f-end"));
  const p=newPermit({number:`SUP-${yr}-${String(seq).padStart(4,"0")}`,type,status:"Received",name:g("f-name"),org:g("f-org"),email:g("f-email"),phone:g("f-phone"),title:g("f-title"),desc:g("f-desc"),location:g("f-loc"),impacts:imps,
    received:TODAY,start,end,expiration:addDays(start,typeOf(type).term),coiReceived:false,coiExp:null,permitteeSigned:null,supSigned:null,complianceComplete:false,closedDate:null});
  audit(p,"Created",`Application received. Folder created: Permit Records/Open Projects/${folderName(p)}`,null,"flow: SUP-Intake");
  addDoc(p,`${p.number}_Application.pdf`,"Application");audit(p,"Document Added",`${p.number}_Application.pdf`,null,"flow: SUP-Intake");
  seedConditions(p);audit(p,"Field Changed",`${p.conditions.length} conditions auto-suggested`,null,"flow: SUP-Intake");
  permits.push(p);state.newResult=p.id;state.lastNew=null;render();
  toast(`${p.number} created`,"Intake flow: next number from Settings.NextSeq, folder created, application PDF saved, conditions suggested, acknowledgement emailed.");
});
window.addEventListener("hashchange",()=>{closeModal();render();});
document.getElementById("role-select").value=state.role;
render();
/* test hook for headless checks */
window.__sup={permits,suggestFor,shortName,folderName,reasons,QUICK,LIBRARY};
})();
</script>
